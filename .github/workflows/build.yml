
name: ClanPvP Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ClanPvP
        run: mvn -B clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ClanPvP
          path: target/ClanPvP.jar
